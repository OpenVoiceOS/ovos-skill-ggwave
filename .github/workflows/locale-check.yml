name: Locale Build Check

on:
  pull_request:
    branches: [dev, master, main]
  workflow_dispatch:

jobs:
  locale_check:
    uses: OpenVoiceOS/gh-automations/.github/workflows/locale-check.yml@dev
    secrets: inherit
    with:
      locale_path: 'ovos_skill_ggwave/locale'
      pr_comment: true
