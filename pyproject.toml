[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-ggwave"
description = "voice interface for ggwave plugin"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "OpenVoiceOS", email = "jarbasai@mailfence.com"}
]
requires-python = ">=3.10"
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-workshop>=9.3.11a2,<10.0.0",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "ovoscope>=1.6.7a1,<2.0.0",
    "ovos-padatious",
    "ovos-adapt-parser",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-skill-ggwave"

[tool.setuptools.dynamic.version]
attr = "ovos_skill_ggwave.version.VERSION"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_skill_ggwave*"]

[tool.setuptools.package-data]
ovos_skill_ggwave = [
    "locale/*/*.voc",
    "locale/*/*.dialog",
    "locale/*/*.entity",
    "locale/*/*.intent",
    "locale/*/*.json",
]

[project.entry-points."opm.skill"]
"ovos-skill-ggwave.openvoiceos" = "ovos_skill_ggwave:GGWaveSkill"
